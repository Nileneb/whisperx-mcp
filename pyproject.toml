[project]
name = "whisperx-mcp"
version = "0.1.0"
description = "Selbst gehosteter WhisperX-Transkriptionsservice als MCP-Tool (Streamable-HTTP)"
requires-python = ">=3.10,<3.12"
dependencies = [
    "mcp>=1.2.0",
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "anyio>=4.4",
    "whisperx>=3.3.0",
]

# Torch/Torchaudio werden im Dockerfile aus dem CUDA-Wheel-Index installiert (cu124),
# damit der GPU-Build deterministisch ist. Lokal genügt der CPU-Default für Import-Checks.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
