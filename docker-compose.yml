services:
  whisperx-mcp:
    build: .
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - API_TOKEN=${API_TOKEN}
      - MODEL=${MODEL:-large-v3-turbo}
      - DEVICE=cuda
      - COMPUTE_TYPE=${COMPUTE_TYPE:-float16}
      - LANGUAGE=${LANGUAGE:-de}
      - ENABLE_DIARIZATION=${ENABLE_DIARIZATION:-1}
    volumes:
      - model-cache:/root/.cache
    # WHY: Synology-NAS terminiert TLS und proxyt per HTTP auf diesen Host:8000.
    # /mcp ist per Bearer-Token geschützt, /health nur Info — LAN-Exposure ist ok.
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            # WHY: CDI (Docker 29 nativ) statt runtime:nvidia — kein Daemon-Restart, stört
            # die parallel laufenden Container (app.linn.games etc.) nicht.
            - driver: cdi
              device_ids:
                - nvidia.com/gpu=all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if __import__('json').load(urllib.request.urlopen('http://localhost:8000/health'))['model_loaded'] else 1)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s
    restart: unless-stopped

# TLS-Terminierung übernimmt die Synology-NAS (Reverse Proxy + Let's-Encrypt-Cert für
# whisper.linn.games) → kein Caddy mehr nötig. Siehe README §"Synology Reverse Proxy".

volumes:
  model-cache:
