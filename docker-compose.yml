services:
  whisperx-mcp:
    build: .
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - API_TOKEN=${API_TOKEN}
      - MODEL=${MODEL:-large-v3-turbo}
      - DEVICE=cuda
      - COMPUTE_TYPE=${COMPUTE_TYPE:-float16}
      - LANGUAGE=${LANGUAGE:-de}
      - ENABLE_DIARIZATION=${ENABLE_DIARIZATION:-1}
      # Energy-Saver: Modell nach N s idle aus dem GPU-VRAM entladen (0 = always-on).
      # Teilt sich die 12-GB-GPU mit dem prod Memory-Stack → Default 5 min.
      - IDLE_UNLOAD_SECONDS=${IDLE_UNLOAD_SECONDS:-300}
    volumes:
      - model-cache:/root/.cache
    # /mcp/ ist per Bearer-Token geschützt, /health nur Info. Für externen Zugriff einen
    # TLS-terminierenden Reverse-Proxy davorsetzen (siehe README §"Reverse-Proxy").
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            # WHY: CDI (Docker 29 nativ) statt runtime:nvidia — kein Daemon-Restart, stört
            # parallel laufende Container nicht.
            - driver: cdi
              device_ids:
                - nvidia.com/gpu=all
              capabilities: [gpu]
    healthcheck:
      # Service-Erreichbarkeit (ready), NICHT model_loaded — sonst killt der Healthcheck
      # den Container, sobald der Energy-Saver das Modell idle entlädt.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if __import__('json').load(urllib.request.urlopen('http://localhost:8000/health')).get('ready') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

# Kein TLS im Container — für externen Zugriff einen Reverse-Proxy davorsetzen (README §"Reverse-Proxy").

volumes:
  model-cache:
